#app{height:100dvh;display:flex;flex-direction:column;max-width:1200px;margin:0 auto;padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.tag{background:var(--pink);color:#fff;font-size:12px;padding:3px 8px;border:2px solid #fff3;white-space:nowrap}
h1{font-size:18px;color:var(--gold2);line-height:1.25}
.dex{margin-left:auto;font-size:13px;color:var(--cyan);white-space:nowrap}
main{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}
.stage{position:relative;flex:1;min-height:200px;border:3px solid var(--gold);background:radial-gradient(circle at 50% 40%,#43264f 0%,#2a1630 70%);
  box-shadow:0 0 0 3px #1a0d1f inset;touch-action:none;overflow:hidden}
.stage canvas{display:block;width:100%;height:100%;cursor:grab}
.stage canvas:active{cursor:grabbing}
.hud{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:center;padding:6px 10px;
  font-size:12px;background:linear-gradient(#1a0d1fcc,#1a0d1f00);pointer-events:none}
.hud .st{color:var(--cyan)} .hud .nm{color:var(--gold2);font-size:15px}
.hint{position:absolute;bottom:8px;left:0;right:0;text-align:center;font-size:12px;color:var(--sub);pointer-events:none;opacity:.9;transition:opacity .6s}
.clear{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:6px;background:#1a0d1fb3;text-align:center;padding:16px}
.clear.on{display:flex}
.clear b{font-size:30px;color:var(--gold2);text-shadow:3px 3px 0 var(--pink)}
.clear span{font-size:14px;color:var(--text);line-height:1.5}
.side{display:flex;flex-direction:column;gap:8px}
.picker{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.pk{position:relative;background:var(--panel);border:2px solid #5b3a6a;color:var(--text);padding:6px 2px 5px;font-size:12px;cursor:pointer;line-height:1.2}
.pk i{display:block;width:18px;height:18px;margin:0 auto 3px;border:2px solid #0004}
.pk.on{border-color:var(--gold2);background:var(--panel2);box-shadow:0 0 0 2px var(--gold) inset}
.pk .ok{position:absolute;top:-6px;right:-4px;font-size:11px;background:var(--green);color:#10301d;padding:0 3px;display:none}
.pk.done .ok{display:block}
.ctrl{background:var(--panel);border:2px solid #5b3a6a;padding:8px 10px;display:flex;flex-direction:column;gap:7px}
.row{display:flex;gap:6px;align-items:center}
.btn{flex:1;background:var(--pink);color:#fff;border:0;padding:9px 6px;font-size:14px;cursor:pointer;box-shadow:0 3px 0 #a3194b}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #a3194b}
.btn.alt{background:#5b3a6a;box-shadow:0 3px 0 #2c1636}
.btn.alt:active{box-shadow:0 1px 0 #2c1636}
.sl{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--sub)}
input[type=range]{flex:1;accent-color:var(--gold2);height:24px}
.info{background:var(--panel);border:2px solid #5b3a6a;padding:8px 10px}
.info .shape{font-size:13px;color:var(--sub);margin-bottom:6px}
.info .shape b{color:var(--gold2)}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.tile{background:#24122b;border:2px dashed #6d4a7d;text-align:center;padding:5px 2px;cursor:pointer;min-height:48px}
.tile small{display:block;font-size:11px;color:var(--dim)}
.tile b{display:block;font-size:18px;color:var(--cyan);margin-top:2px}
.tile.open{border-style:solid;border-color:var(--cyan)}
.fact{font-size:12px;color:var(--sub);margin-top:7px;line-height:1.5}
footer{font-size:11px;color:var(--dim);text-align:center;margin-top:6px}
footer a{color:var(--dim)}
#no3d{display:none;position:absolute;inset:0;align-items:center;justify-content:center;text-align:center;padding:16px;font-size:14px;line-height:1.6;color:var(--sub)}
@media (min-width:860px){
  main{flex-direction:row}
  .stage{flex:1.4}
  .side{flex:1;max-width:420px;overflow:auto}
  h1{font-size:22px}
  .pk{font-size:13px}
}
@media (max-width:400px){.pk{font-size:11px;letter-spacing:-.03em}}
@media (max-height:640px) and (max-width:859px){
  .fact{display:none}
  .tile{min-height:40px;padding:3px 2px} .tile b{font-size:15px}
  h1{font-size:15px}
}
</style>
</head>
<body>
<div id="app">
  <header>
    <span class="tag px">3D 미리보기 #1</span>
    <h1 class="px">정다면체 5개, 돌리고 펼쳐 보기</h1>
    <span class="dex px" id="dex">도감 0/5</span>
  </header>
  <main>
    <div class="stage" id="stage">
      <div class="hud px"><span class="st" id="st">STAGE 1/5</span><span class="nm" id="nm">정사면체</span><span class="st" id="pct">접힘</span></div>
      <div class="hint px" id="hint">손가락으로 끌어서 돌려 보세요</div>
      <div class="clear" id="clear"><b class="px">ALL CLEAR!</b><span class="px">정다면체 5개를 모두 펼쳐 봤어요<br>정다면체는 딱 이 5개뿐이에요</span><button class="btn alt px" id="clearClose" style="flex:none;padding:8px 18px;margin-top:6px">계속 보기</button></div>
      <div id="no3d">이 기기에서는 3D 화면을 열 수 없어요.<br>크롬이나 사파리 최신 버전에서 다시 열어 주세요.</div>
    </div>
    <div class="side">
      <div class="picker" id="picker"></div>
      <div class="ctrl">
        <div class="row">
          <button class="btn px" id="unfold">▶ 펼치기</button>
          <button class="btn alt px" id="spin">회전 멈추기</button>
          <button class="btn alt px" id="reset">처음 각도</button>
        </div>
        <div class="sl px"><span>접기</span><input type="range" id="slider" min="0" max="100" value="0" aria-label="펼친 정도"><span>펼치기</span></div>
      </div>
      <div class="info">
        <div class="shape" id="shape"></div>
        <div class="tiles" id="tiles"></div>
        <div class="fact" id="fact"></div>
      </div>
    </div>
  </main>
  <footer>유경쌤 픽셀 수학 · 중1 입체도형 · <a href="https://www.instagram.com/yugyeong.math/" target="_blank" rel="noopener">@yugyeong.math</a></footer>
</div>

  const n=faceNormal(s.S,s.H.root);
  const qa=new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(n[0],n[1],n[2]),new THREE.Vector3(0,0,1));
  const pts=allPoints(s,faceMatrices(s,1)).map(p=>p.applyQuaternion(qa));
  let cx=0,cy=0;pts.forEach(p=>{cx+=p.x;cy+=p.y});cx/=pts.length;cy/=pts.length;
  let sxx=0,syy=0,sxy=0;pts.forEach(p=>{const x=p.x-cx,y=p.y-cy;sxx+=x*x;syy+=y*y;sxy+=x*y});
  const phi=0.5*Math.atan2(2*sxy,sxx-syy);
  const w=stage.clientWidth,h=stage.clientHeight;
  const target=(w>=h)?0:Math.PI/2;
  const qz=new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,0,1),target-phi);
  netQ=qz.multiply(qa);
}
function build(){
  meshes.forEach(m=>{inner.remove(m);m.geometry.dispose();});meshes=[];
  const s=SOLIDS[state.cur];
  const mat=new THREE.MeshLambertMaterial({color:s.color,side:THREE.DoubleSide,polygonOffset:true,polygonOffsetFactor:1,polygonOffsetUnits:1});
  const baseMat=new THREE.MeshLambertMaterial({color:new THREE.Color(s.color).lerp(new THREE.Color(0xffffff),0.35),side:THREE.DoubleSide,polygonOffset:true,polygonOffsetFactor:1,polygonOffsetUnits:1});
  const lineMat=new THREE.LineBasicMaterial({color:0x1a0d1f});
  s.S.F.forEach((f,fi)=>{
    const P=f.map(i=>s.S.V[i]);const pos=[];
    for(let k=1;k<P.length-1;k++)pos.push(...P[0],...P[k],...P[k+1]);
    const g=new THREE.BufferGeometry();g.setAttribute("position",new THREE.Float32BufferAttribute(pos,3));g.computeVertexNormals();
    const m=new THREE.Mesh(g,fi===s.H.root?baseMat:mat);m.matrixAutoUpdate=false;
    const lg=new THREE.BufferGeometry();lg.setAttribute("position",new THREE.Float32BufferAttribute(P.flat(),3));
    m.add(new THREE.LineLoop(lg,lineMat));
    inner.add(m);meshes.push(m);
  });
  computeNetQ();
}
function select(i){
  if(state.anim)state.anim=null;
  state.cur=i;viewQ.identity();setT(0);build();renderInfo();
}
function animateTo(target){state.anim={from:state.t,to:target,start:performance.now(),dur:2200*Math.abs(target-state.t)+200};}
$("unfold").onclick=()=>animateTo(state.t>=0.5?0:1);
$("slider").oninput=e=>{state.anim=null;setT(e.target.value/100);};
$("spin").onclick=()=>{state.spin=!state.spin;$("spin").textContent=state.spin?"회전 멈추기":"회전 켜기";};
$("reset").onclick=()=>{viewQ.identity();baseQ.copy(BASE0);};

/* 끌어서 돌리기 */
let drag=null;
const cv=renderer.domElement;
cv.addEventListener("pointerdown",e=>{drag={x:e.clientX,y:e.clientY};cv.setPointerCapture(e.pointerId);
  if(!state.dragged){state.dragged=true;$("hint").style.opacity=0;}});
cv.addEventListener("pointermove",e=>{if(!drag)return;
  const dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag={x:e.clientX,y:e.clientY};
  const k=0.008;
  const qy=new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,1,0),dx*k);
  const qx=new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1,0,0),dy*k);
  viewQ.premultiply(qy).premultiply(qx);});
const endDrag=()=>{drag=null};
cv.addEventListener("pointerup",endDrag);cv.addEventListener("pointercancel",endDrag);
document.addEventListener("keydown",e=>{
  const k={ArrowLeft:[0,-1],ArrowRight:[0,1],ArrowUp:[-1,0],ArrowDown:[1,0]}[e.key];if(!k)return;
  e.preventDefault();viewQ.premultiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(k[0]?1:0,k[1]?1:0,0),0.15*(k[0]||k[1])));
});

function resize(){
  const w=stage.clientWidth,h=stage.clientHeight;if(!w||!h)return;
  renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();computeNetQ();
}
new ResizeObserver(resize).observe(stage);

const ease=x=>x<.5?2*x*x:1-2*(1-x)*(1-x);
let last=performance.now();
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;
  if(state.anim){const a=state.anim;let p=(now-a.start)/a.dur;if(p>=1){p=1;state.anim=null;}
    setT(a.from+(a.to-a.from)*ease(p));}
  if(state.spin&&!drag)baseQ.premultiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,1,0),dt*0.5));
  const s=SOLIDS[state.cur];const t=state.t;
  const M=faceMatrices(s,t);meshes.forEach((m,fi)=>m.matrix.copy(M[fi]));
  const pts=allPoints(s,M);
  const box=new THREE.Box3().setFromPoints(pts);const c=box.getCenter(new THREE.Vector3());
  inner.position.copy(c).negate();
  const q=baseQ.clone().slerp(netQ,ease(t));root.quaternion.copy(viewQ).multiply(q);
  // 화면에 꽉 차게 카메라 거리 맞추기
  let r=0;pts.forEach(p=>r=Math.max(r,p.distanceTo(c)));
  const vf=camera.fov*Math.PI/360,hf=Math.atan(Math.tan(vf)*camera.aspect);
  const sphereD=r/Math.sin(Math.min(vf,hf))*1.08;
  let hw=0,hh=0,zm=0;pts.forEach(p=>{const v=p.clone().sub(c).applyQuaternion(root.quaternion);hw=Math.max(hw,Math.abs(v.x));hh=Math.max(hh,Math.abs(v.y));zm=Math.max(zm,v.z);});
  const boxD=Math.max(hw/Math.tan(hf),hh/Math.tan(vf))*1.2+zm;
  const target=sphereD+(boxD-sphereD)*ease(t);
  camDist+= (target-camDist)*Math.min(1,dt*6);
  camera.position.set(0,0,camDist);camera.lookAt(0,0,0);
  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}
select(0);resize();camDist=3;
requestAnimationFrame(frame);
window.__setT__=setT; window.__select__=select; window.__state__=state;
})();

</script>
</body>
</html>
